repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  # Analysis notebooks are committed without outputs: the EFD queries only run
  # on the RSP, so stored outputs are noise in the diff and go stale silently.
  # Figures for the technote are saved to _extra/plots/ instead.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # --keep-id: the cells have hand-written ids (cell-params, cell-imports)
        # that the notes refer to; the default would renumber them 0, 1, 2, ...
        args: [--keep-id]
